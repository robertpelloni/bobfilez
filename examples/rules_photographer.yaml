# Photographer and Media Professional Rules
# Routes by filename pattern into date folders. Dates come from the
# file modification time ({year}/{month}/{day}); EXIF-date routing is
# not implemented, so {exif:...} templates are intentionally not used.

- name: Raw Image Organization
  pattern: "*.{cr2,cr3,nef,arw,dng}"
  target: "Photography/{year}/{month}-{day}_RAW_Shoots/{filename}"

- name: Processed JPEG Exports
  pattern: "*.jpg"
  target: "Photography/{year}/Final_Exports/{filename}"

- name: High Quality Video Renders
  pattern: "*.{mp4,mov,mkv}"
  target: "Video_Projects/{year}/{month}-{day}/{filename}"

- name: Isolate Audio Stems
  pattern: "*.{wav,flac,mp3}"
  target: "Audio_Stems/{year}/{filename}"

# bobfilez never deletes via organization rules. Sidecars are routed
# to a review folder; delete them manually after checking.
- name: Isolate temporary sidecar files for review
  pattern: "*.{xmp,crd}"
  target: "Review/Sidecars/{filename}"
